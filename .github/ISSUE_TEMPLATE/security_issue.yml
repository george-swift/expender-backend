## ⚠️ Security Notice

**🚨 CRITICAL SECURITY ISSUES**: Please report critical security vulnerabilities privately via email to security@expender.app instead of using this public template.

This template is for:
- Non-critical security improvements
- Security configuration questions
- Best practice recommendations
- Security feature requests

