name: ❓ Question or Documentation
description: Ask questions about usage, request documentation improvements, or seek clarification
title: "[QUESTION] "
labels: ["question", "documentation"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## ❓ Question Summary
        Thank you for your question! Please provide as much detail as possible to help us give you the best answer.

  - type: dropdown
    id: question-type
    attributes:
      label: Question Category
      description: What type of question do you have?
      options:
        - 🚀 Getting Started & Setup
        - 🔧 API Usage & Integration
        - 🤖 SmartScan Functionality
        - 🏗️ Infrastructure & Deployment
        - 🔒 Security & Authentication
        - 📊 Monitoring & Troubleshooting
        - 💰 Cost Management
        - 📈 Performance Optimization
        - 🔄 Best Practices
        - 📝 Documentation Improvement
    validations:
      required: true

  - type: textarea
    id: specific-question
    attributes:
      label: Specific Question
      description: What would you like to know?
      placeholder: Please provide your specific question or what you're trying to accomplish.
    validations:
      required: true

  - type: textarea
    id: current-understanding
    attributes:
      label: Current Understanding
      description: What do you already know about this topic?
      placeholder: Describe your current level of understanding or what you've already tried.

  - type: checkboxes
    id: research-done
    attributes:
      label: Research Done
      description: What resources have you already consulted?
      options:
        - label: Checked README.md
        - label: Reviewed API documentation
        - label: Searched existing issues
        - label: Consulted AWS documentation
        - label: Searched online resources

  - type: textarea
    id: use-case
    attributes:
      label: Use Case & Context
      description: Describe what you're trying to achieve or build
      placeholder: I'm trying to build/implement/understand...

  - type: dropdown
    id: experience-level
    attributes:
      label: Experience Level
      description: What's your experience level with this platform?
      options:
        - 🟢 Beginner (new to the platform)
        - 🟡 Intermediate (some experience)
        - 🟠 Advanced (experienced user)
        - 🔴 Expert (contributor/maintainer)

  - type: textarea
    id: environment-details
    attributes:
      label: Environment Details
      description: Provide relevant environment information
      placeholder: |
        - Operating System: [macOS/Windows/Linux]
        - Python version: [3.12+]
        - AWS region: [e.g., us-east-1]
        - Development/Production environment
      render: markdown

  - type: textarea
    id: code-examples
    attributes:
      label: Code Examples (if applicable)
      description: Show what you're trying to do with code
      placeholder: |
        ```python
        # Example of what you're trying to accomplish
        example = "show your code attempt"
        ```
      render: markdown

  - type: checkboxes
    id: ideal-answer
    attributes:
      label: What Would Help Most?
      description: What format would be most helpful for your answer?
      options:
        - label: Step-by-step instructions
        - label: Code examples
        - label: Architecture explanation
        - label: Troubleshooting steps
        - label: Best practices guide
        - label: Links to relevant documentation
        - label: Video tutorial or demo

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      description: How urgent is this question for your work?
      options:
        - 🔴 Blocking my work
        - 🟠 High priority
        - 🟡 Medium priority
        - 🟢 Low priority
        - 💡 Nice to know

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information that might be helpful
      placeholder: Include any additional details, constraints, or context that might help us provide a better answer.
