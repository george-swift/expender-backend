name: 🚀 Feature Request
description: Suggest a new feature or enhancement for Expender
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Feature Request
        Thank you for suggesting a new feature! Please provide detailed information to help us understand your request.

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you'd like to see
      placeholder: I would like to see...
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Describe the use case and why this would be valuable.
      placeholder: |
        - What problem are you trying to solve?
        - Who would benefit from this feature?
        - What's the current limitation or gap?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working
      placeholder: |
        The feature could work by...

        Example user flow:
        1. User does X
        2. System responds with Y
        3. User can then Z

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered
      placeholder: |
        - Alternative approach 1
        - Alternative approach 2
        - Why the proposed solution is preferred

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature Category
      description: Which part of the application does this feature relate to?
      options:
        - 💰 Expense Management (CRUD operations)
        - 🤖 SmartScan AI (Receipt processing)
        - 📈 Data Export & Reporting
        - 👥 User Management & Quotas
        - 🔒 Authentication & Security
        - 🏗️ Infrastructure & Performance
        - 📱 API & Integration
        - 📊 Analytics & Monitoring
        - Other
    validations:
      required: true

  - type: checkboxes
    id: feature-type
    attributes:
      label: Feature Type
      description: What type of feature is this?
      options:
        - label: "🎯 New functionality"
        - label: "🔧 Enhancement to existing feature"
        - label: "🚀 Performance improvement"
        - label: "🛡️ Security enhancement"
        - label: "🎨 User experience improvement"
        - label: "🔌 Integration/API enhancement"

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How important is this feature to you?
      options:
        - 🔥 Critical (blocking users)
        - ⭐ High (significant user value)
        - 📈 Medium (nice to have)
        - 💡 Low (future enhancement)
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: How complex do you think this feature might be to implement?
      options:
        - 🟢 Low (< 1 week)
        - 🟡 Medium (1-3 weeks)
        - 🟠 High (3-6 weeks)
        - 🔴 Very High (> 6 weeks)
        - ❓ Unsure

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Define what "done" looks like for this feature
      placeholder: |
        - [ ] User can accomplish X
        - [ ] System responds with Y
        - [ ] API returns Z
        - [ ] Documentation is updated
        - [ ] Tests are implemented

  - type: checkboxes
    id: business-value
    attributes:
      label: Expected Benefits
      description: What benefits would this feature provide?
      options:
        - label: "📈 Improved user experience"
        - label: "🚀 Increased user engagement"
        - label: "💰 Cost reduction"
        - label: "⚡ Performance improvement"
        - label: "🎯 Competitive advantage"
        - label: "👨‍💻 Developer productivity"

  - type: textarea
    id: success-metrics
    attributes:
      label: Success Metrics
      description: How would you measure the success of this feature?
      placeholder: |
        - User adoption rate: target %
        - Performance improvement: target metrics
        - User satisfaction: measurement method

  - type: checkboxes
    id: technical-impact
    attributes:
      label: Technical Considerations
      description: What areas might be affected by implementing this feature?
      options:
        - label: "🗄️ Database schema changes"
        - label: "🔌 New API endpoints"
        - label: "🏗️ Infrastructure updates"
        - label: "🔒 Security considerations"
        - label: "📊 Monitoring changes"
        - label: "📝 Documentation updates"
        - label: "💰 Cost implications"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information that might be helpful
      placeholder: |
        - Timeline considerations
        - Dependencies on other features
        - Similar features in other tools
        - User feedback or research
        - Related issues or discussions

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this feature request, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
