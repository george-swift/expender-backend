name: ⚡ Performance Issue
description: Report performance problems, optimization requests, or scaling concerns
title: "[PERFORMANCE] "
labels: ["performance", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## ⚡ Performance Issue
        Thank you for reporting a performance issue! Please provide detailed metrics and information to help us optimize the system.

  - type: textarea
    id: performance-summary
    attributes:
      label: Performance Issue Summary
      description: A clear and concise description of the performance issue or optimization opportunity
      placeholder: Describe the performance problem you're experiencing
    validations:
      required: true

  - type: dropdown
    id: performance-domain
    attributes:
      label: Performance Category
      description: Which area is experiencing performance issues?
      options:
        - 🚀 API Response Time
        - 🤖 SmartScan Processing Speed
        - 🗄️ Database Query Performance
        - 📦 Lambda Cold Starts
        - 🌐 CDN/Static Asset Delivery
        - 📈 Throughput/Concurrency
        - 💾 Memory Usage
        - 🔄 Event Processing Latency
        - 📊 Data Export Performance
        - 🎯 User Experience Responsiveness
        - Other
    validations:
      required: true

  - type: checkboxes
    id: issue-type
    attributes:
      label: Issue Type
      description: What type of performance issue is this?
      options:
        - label: "🐌 Slow response times"
        - label: "📈 Poor scalability"
        - label: "💰 High resource costs"
        - label: "🔄 Inefficient algorithms"
        - label: "🗄️ Database bottlenecks"
        - label: "📦 Large payload sizes"
        - label: "⏱️ Timeout issues"
        - label: "🎯 User experience degradation"

  - type: checkboxes
    id: affected-components
    attributes:
      label: Affected Services/Endpoints
      description: Which parts of the system are affected?
      options:
        - label: "/expenses (CRUD operations)"
        - label: "/expenses/batch (Bulk operations)"
        - label: "/expenses/export (CSV generation)"
        - label: "/smartscans (Receipt processing)"
        - label: "/quotas (User limits)"
        - label: "/webhooks (External integrations)"
        - label: "GraphQL subscriptions"
        - label: "File upload/download"

  - type: checkboxes
    id: aws-services
    attributes:
      label: AWS Services Involved
      description: Which AWS services are experiencing performance issues?
      options:
        - label: "⚡ Lambda functions"
        - label: "🌐 API Gateway"
        - label: "🗄️ DynamoDB"
        - label: "📦 S3"
        - label: "🌍 CloudFront"
        - label: "🔍 Textract"
        - label: "🔄 EventBridge"
        - label: "📊 Step Functions"

  - type: textarea
    id: current-performance
    attributes:
      label: Current Performance Metrics
      description: Provide specific performance data you're observing
      placeholder: |
        **Current Performance:**
        - Response time: [ms] (target: [ms])
        - Throughput: [requests/sec] (target: [requests/sec])
        - Error rate: [%] (target: [%])
        - Memory usage: [MB] (limit: [MB])
        - CPU utilization: [%] (limit: [%])
        - Cold start frequency: [%]

        **When did performance degrade?** [timestamp/date]
        **Performance before:** [metrics]
        **Performance now:** [metrics]
        **Percentage degradation:** [%]
    validations:
      required: true

  - type: dropdown
    id: business-impact
    attributes:
      label: User Experience Impact
      description: How does this performance issue affect users?
      options:
        - 🔴 Critical - Service unusable
        - 🟠 High - Significant user frustration
        - 🟡 Medium - Noticeable delays
        - 🟢 Low - Minor inconvenience
        - 📊 Metrics only - No user impact
    validations:
      required: true

  - type: textarea
    id: business-metrics
    attributes:
      label: Business Impact Details
      description: Quantify the impact on users and business
      placeholder: |
        - Affected users: [number/percentage]
        - Revenue impact: [estimate if applicable]
        - User satisfaction: [survey scores, complaints]
        - Competitive disadvantage: [Yes/No]

  - type: textarea
    id: performance-data
    attributes:
      label: Detailed Performance Data
      description: Provide CloudWatch metrics and monitoring data
      placeholder: |
        **CloudWatch Metrics:**
        ```
        Function Duration: [p50, p90, p99]
        Invocation Count: [per hour/day]
        Error Count: [number]
        Throttle Count: [number]
        Memory Utilization: [average %]
        ```

        **Database Performance:**
        ```
        Read/Write Capacity: [consumed vs provisioned]
        Query Latency: [average ms]
        Scan Operations: [count and impact]
        Hot Partitions: [identified keys]
        Index Usage: [GSI efficiency]
        ```

        **API Gateway Metrics:**
        ```
        Integration Latency: [ms]
        Overall Latency: [ms]
        4xx Errors: [count]
        5xx Errors: [count]
        Cache Hit Ratio: [%]
        ```
      render: markdown

  - type: textarea
    id: root-cause-analysis
    attributes:
      label: Root Cause Investigation
      description: What troubleshooting and analysis have you done?
      placeholder: |
        **Investigation steps completed:**
        - [ ] Reviewed CloudWatch logs
        - [ ] Analyzed performance metrics
        - [ ] Profiled Lambda functions
        - [ ] Examined database queries
        - [ ] Checked network latency
        - [ ] Analyzed payload sizes
        - [ ] Reviewed algorithm complexity

        **Suspected causes:**
        - [ ] Inefficient algorithms
        - [ ] Large data processing
        - [ ] Cold start overhead
        - [ ] Database hot partitions
        - [ ] Network bottlenecks
        - [ ] Memory leaks
        - [ ] Synchronous processing

        **Evidence:**
        [Paste relevant logs, metrics, or profiling data]

  - type: textarea
    id: performance-targets
    attributes:
      label: Performance Targets
      description: What performance levels are you trying to achieve?
      placeholder: |
        **Target Metrics:**
        - API response time: < [ms]
        - SmartScan processing: < [seconds]
        - Export generation: < [minutes]
        - Database queries: < [ms]
        - Memory usage: < [MB]
        - Cold start ratio: < [%]

        **Service Level Objectives (SLOs):**
        - 95% of requests complete in < [ms]
        - 99.9% uptime
        - < 0.1% error rate
        - 99% of SmartScan processing completes in < [seconds]

  - type: textarea
    id: proposed-solutions
    attributes:
      label: Proposed Solutions
      description: What optimizations do you think would help?
      placeholder: |
        **Immediate Optimizations:**
        1. Solution 1 - [expected improvement]
        2. Solution 2 - [expected improvement]
        3. Solution 3 - [expected improvement]

        **Long-term Improvements:**
        1. Architectural change 1
        2. Scaling strategy 2
        3. Technology upgrade 3

  - type: checkboxes
    id: resource-adjustments
    attributes:
      label: Resource Adjustments Needed
      description: What resource changes might help?
      options:
        - label: "📈 Increase Lambda memory/timeout"
        - label: "🗄️ Scale DynamoDB capacity"
        - label: "📊 Add database indexes"
        - label: "💾 Implement caching"
        - label: "🔍 Optimize queries"
        - label: "📦 Reduce payload sizes"
        - label: "⚙️ Algorithm optimization"

  - type: textarea
    id: testing-strategy
    attributes:
      label: Performance Testing Plan
      description: How should we test performance improvements?
      placeholder: |
        **Test Scenarios:**
        1. Normal load: [X requests/sec for Y minutes]
        2. Peak load: [X requests/sec for Y minutes]
        3. Stress test: [X requests/sec until failure]
        4. Data volume: [X records/operations]

        **Testing Tools:**
        - Testing tool: [e.g., Artillery, JMeter, k6]
        - Test environment: [dev/staging]
        - Monitoring during tests: [CloudWatch, X-Ray]

  - type: textarea
    id: cost-impact
    attributes:
      label: Cost Impact Analysis
      description: What are the cost implications?
      placeholder: |
        **Current Costs:**
        - Lambda execution: $[amount/month]
        - DynamoDB: $[amount/month]
        - Data transfer: $[amount/month]
        - Other services: $[amount/month]

        **Optimization Potential:**
        - Expected cost reduction: [%] or $[amount]
        - Performance per dollar improvement: [metrics]
        - ROI timeline: [months to break even]

  - type: checkboxes
    id: success-metrics
    attributes:
      label: Success Criteria
      description: How will you measure the success of performance improvements?
      options:
        - label: "⚡ Response time improved by [%]"
        - label: "📈 Throughput increased by [%]"
        - label: "📉 Error rate reduced by [%]"
        - label: "💰 Cost reduced by [%]"
        - label: "😊 User satisfaction improved"
        - label: "🎯 SLO compliance achieved"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other relevant information
      placeholder: |
        **Related Performance Issues:**
        - Links to related issues
        - Previous optimization efforts

        **External Dependencies:**
        - Third-party API performance
        - AWS service limits
        - Network constraints
        - Client-side factors

        **Timeline:**
        - Any deadlines or urgency
        - Dependencies on other work
